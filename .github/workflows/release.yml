name: Release

on:
  # 自动发布只接收 CI 完成事件，后续 job 还会继续校验来源、分支与结论。
  workflow_run:
    workflows:
      - CI
    types:
      - completed
  # 保留人工恢复入口，但只允许从 main 的当前提交发布。
  workflow_dispatch:

# 工作流默认只读；GHCR 写权限仅在镜像发布 job 内单独授予。
permissions:
  contents: read

# 生产环境不并行发布，避免前端与镜像被两次运行交叉覆盖。
concurrency:
  group: speechoptimizer-production-release
  cancel-in-progress: false

jobs:
  verify-release:
    name: Verify release commit
    # 生产开关默认不存在；只有显式设为 true 且来源可信时才进入发布链。
    if: >-
      vars.PRODUCTION_DEPLOY_ENABLED == 'true' &&
      (
        (
          github.event_name == 'workflow_run' &&
          github.event.workflow_run.conclusion == 'success' &&
          github.event.workflow_run.event == 'push' &&
          github.event.workflow_run.head_branch == 'main'
        ) ||
        (
          github.event_name == 'workflow_dispatch' &&
          github.ref == 'refs/heads/main'
        )
      )
    runs-on: ubuntu-latest
    timeout-minutes: 25
    env:
      # 非交互 Runner 必须启用 CI 模式，避免 pnpm 因无 TTY 中断。
      CI: "1"
    outputs:
      release_sha: ${{ steps.release-source.outputs.sha }}
    steps:
      - name: Resolve immutable release commit
        id: release-source
        shell: bash
        env:
          EVENT_NAME: ${{ github.event_name }}
          WORKFLOW_RUN_SHA: ${{ github.event.workflow_run.head_sha }}
          DISPATCH_SHA: ${{ github.sha }}
        run: |
          set -euo pipefail
          if [[ "${EVENT_NAME}" == "workflow_run" ]]; then
            release_sha="${WORKFLOW_RUN_SHA}"
          else
            release_sha="${DISPATCH_SHA}"
          fi
          if [[ ! "${release_sha}" =~ ^[0-9a-f]{40}$ ]]; then
            echo "[release] 无法解析可信的 40 位提交 SHA" >&2
            exit 1
          fi
          echo "sha=${release_sha}" >> "${GITHUB_OUTPUT}"
          echo "[release] 已锁定待发布提交 ${release_sha}"

      - name: Checkout verified source
        uses: actions/checkout@v7
        with:
          # 发布必须复用触发 CI 的精确提交，不能漂移到 main 的更新状态。
          ref: ${{ steps.release-source.outputs.sha }}
          persist-credentials: false

      - name: Setup Node.js 24
        uses: actions/setup-node@v7
        with:
          node-version: "24"
          # Release 不依赖隐式 package-manager cache，逐包 frozen install 是唯一依赖入口。
          package-manager-cache: false

      - name: Setup pnpm
        uses: pnpm/action-setup@v6
        with:
          version: "11.25.0"
          run_install: false

      - name: Install locked dependencies
        shell: bash
        run: |
          set -euo pipefail
          # 仓库尚未统一根 workspace，因此逐个使用包内 lockfile 冻结安装。
          packages=(
            prototype
            spikes/sdk-integrations
            packages/speech-engine
            packages/provider-adapters
            services/core-platform
            services/account-billing
            apps/mvp-server
          )
          for package_dir in "${packages[@]}"; do
            echo "[release] install ${package_dir}"
            pnpm --dir "${package_dir}" install --frozen-lockfile
          done

      - name: Run primary quality gate
        run: node scripts/quality-gate.mjs all --require-feature-tests

      - name: Run independent UTC quality gate
        env:
          # 固定 UTC 再跑一轮，覆盖日期、周期与过期边界。
          TZ: UTC
        run: node scripts/quality-gate.mjs all --require-feature-tests

      - name: Check final diff formatting
        run: git diff --check

  publish-api-image:
    name: Publish API image
    needs:
      - verify-release
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: read
      # 只有本 job 可以使用 GITHUB_TOKEN 写入 GHCR。
      packages: write
    steps:
      - name: Checkout verified source
        uses: actions/checkout@v7
        with:
          ref: ${{ needs.verify-release.outputs.release_sha }}
          # 镜像发布使用 GITHUB_TOKEN 登录 GHCR，不需要保留 Git 凭证。
          persist-credentials: false

      - name: Resolve lowercase image tags
        id: image
        shell: bash
        env:
          RELEASE_SHA: ${{ needs.verify-release.outputs.release_sha }}
        run: |
          set -euo pipefail
          image_name="ghcr.io/${GITHUB_REPOSITORY,,}-mvp-server"
          echo "sha=${image_name}:${RELEASE_SHA}" >> "${GITHUB_OUTPUT}"
          echo "latest=${image_name}:latest" >> "${GITHUB_OUTPUT}"
          echo "[release] 已生成不可变 SHA 标签与 latest 标签"

      - name: Setup Docker Buildx
        uses: docker/setup-buildx-action@v4

      - name: Login to GitHub Container Registry
        uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and publish API image
        uses: docker/build-push-action@v7
        with:
          # Dockerfile 会从仓库根复制多个内部 package，因此 context 必须保持为根目录。
          context: .
          file: apps/mvp-server/Dockerfile
          platforms: linux/amd64
          push: true
          tags: |
            ${{ steps.image.outputs.sha }}
            ${{ steps.image.outputs.latest }}

  deploy-vercel-production:
    name: Deploy Vercel production
    needs:
      - verify-release
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: read
    env:
      # 三个值均来自 Repository Secrets；日志只检查是否存在，不输出内容。
      VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
      VERCEL_ORG_ID: ${{ secrets.VERCEL_ORG_ID }}
      VERCEL_PROJECT_ID: ${{ secrets.VERCEL_PROJECT_ID }}
    defaults:
      run:
        working-directory: prototype
    steps:
      - name: Checkout verified source
        uses: actions/checkout@v7
        with:
          ref: ${{ needs.verify-release.outputs.release_sha }}
          # Vercel 通过独立 token 认证，不需要保留 Git 凭证。
          persist-credentials: false

      - name: Setup Node.js 24
        uses: actions/setup-node@v7
        with:
          node-version: "24"
          # Vercel 构建由 CLI 管理依赖，不启用 setup-node 的自动缓存探测。
          package-manager-cache: false

      - name: Setup pnpm
        uses: pnpm/action-setup@v6
        with:
          version: "11.25.0"
          run_install: false

      - name: Validate Vercel secrets
        shell: bash
        run: |
          set -euo pipefail
          for secret_name in VERCEL_TOKEN VERCEL_ORG_ID VERCEL_PROJECT_ID; do
            if [[ -z "${!secret_name:-}" ]]; then
              echo "[release] 缺少必需的 Repository Secret: ${secret_name}" >&2
              exit 1
            fi
          done
          echo "[release] Vercel 凭证键已就绪"

      - name: Install pinned Vercel CLI
        run: npm install --global vercel@59.11.2

      - name: Pull Vercel production settings
        run: vercel pull --yes --environment=production --token="${VERCEL_TOKEN}"

      - name: Build Vercel production artifact
        run: vercel build --prod --token="${VERCEL_TOKEN}"

      - name: Deploy prebuilt artifact to production
        run: vercel deploy --prebuilt --prod --token="${VERCEL_TOKEN}"
